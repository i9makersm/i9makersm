<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ERP Educacional</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --purple:#7c3aed;--purple-d:#4c1d95;--purple-l:#f5f3ff;
  --green:#16a34a;--green-l:#f0fdf4;--green-b:#bbf7d0;
  --red:#ef4444;--red-l:#fef2f2;--red-b:#fca5a5;
  --amber:#d97706;--amber-l:#fffbeb;--amber-b:#fde68a;
  --blue:#0369a1;--blue-l:#eff6ff;--blue-b:#bfdbfe;
  --teal:#0f6e56;
  --bg:#f0efff;--card:#fff;--border:rgba(0,0,0,0.08);
  --text:#111827;--text2:#6b7280;--text3:#9ca3af;
  --r:16px;--rsm:10px;
  font-family:'Inter','Segoe UI',system-ui,sans-serif;
}
html,body{height:100%;overflow:hidden}
body{background:#1a1a2e;display:flex;align-items:center;justify-content:center}

/* Phone frame */
.phone{width:390px;height:844px;background:var(--bg);border-radius:40px;overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(0,0,0,0.6),0 0 0 1px rgba(255,255,255,0.1);display:flex;flex-direction:column}

/* Header */
.hdr{flex-shrink:0;padding:52px 20px 38px;position:relative;overflow:hidden}
.hdr::before{content:'';position:absolute;top:-50px;right:-50px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,0.06);pointer-events:none}
.hdr::after{content:'';position:absolute;bottom:-20px;left:20%;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,0.04);pointer-events:none}
.hdr-row{display:flex;align-items:center;gap:12px;margin-bottom:0}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#fff;flex-shrink:0;letter-spacing:-.5px}
.kpi-strip{display:flex;gap:8px;margin-top:14px}
.kpi-c{flex:1;background:rgba(255,255,255,0.12);border:0.5px solid rgba(255,255,255,0.18);border-radius:11px;padding:9px 10px}
.kpi-c p:first-child{color:rgba(255,255,255,0.6);font-size:9px;font-weight:500;margin-bottom:3px}
.kpi-c p:last-child{font-weight:700;font-size:14px;letter-spacing:-.3px}

/* Float card */
.float-card{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:0 8px 32px rgba(0,0,0,0.14);border:0.5px solid var(--border);margin:-22px 14px 0;position:relative;z-index:10;flex-shrink:0}

/* Scroll area */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 14px 0}
.scroll::-webkit-scrollbar{width:2px}
.scroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.12);border-radius:99px}

/* Bottom nav */
.bnav{flex-shrink:0;background:rgba(255,255,255,0.97);backdrop-filter:blur(16px);border-top:0.5px solid var(--border);display:flex;padding:0 6px 8px;height:72px;align-items:flex-start;padding-top:6px}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border:none;background:transparent;cursor:pointer;border-radius:10px;transition:background .12s}
.nb.on{background:var(--purple-l)}
.nb i{font-size:22px;color:var(--text3);transition:color .12s}
.nb.on i{color:var(--purple)}
.nb span{font-size:9px;font-weight:600;color:var(--text3);transition:color .12s;line-height:1}
.nb.on span{color:var(--purple)}

/* Cards */
.card{background:var(--card);border:0.5px solid var(--border);border-radius:var(--r);padding:15px;margin-bottom:11px}
.ct{font-size:13px;font-weight:700;color:var(--text);margin-bottom:11px;display:flex;align-items:center;gap:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.sbox{background:#f9fafb;border:0.5px solid var(--border);border-radius:var(--rsm);padding:9px;text-align:center}
.sbox .v{font-size:19px;font-weight:700;color:var(--text)}
.sbox .l{font-size:9px;color:var(--text3);margin-top:1px}

/* Pill */
.pill{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.p-ok{background:var(--green-l);color:var(--green)}
.p-err{background:var(--red-l);color:var(--red)}
.p-warn{background:var(--amber-l);color:var(--amber)}
.p-info{background:var(--blue-l);color:var(--blue)}
.p-neu{background:#f3f4f6;color:var(--text2)}

/* Btn */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:9px 14px;border-radius:var(--rsm);font-size:12px;font-weight:600;cursor:pointer;border:0.5px solid var(--border);background:var(--card);color:var(--text);font-family:inherit;transition:all .12s;letter-spacing:-.1px}
.btn:active{transform:scale(.97)}
.b-prim{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 4px 14px rgba(124,58,237,.28)}
.b-ok{background:var(--green-l);border-color:var(--green-b);color:var(--green)}
.b-err{background:var(--red-l);border-color:var(--red-b);color:var(--red)}
.b-full{width:100%}
.b-disabled{opacity:.38;pointer-events:none}

/* Hold btn */
.hold{position:relative;overflow:hidden;border-radius:13px;border:1.5px solid var(--hb,var(--purple));height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;user-select:none;-webkit-user-select:none;flex:1;transition:box-shadow .2s}
.hold .hf{position:absolute;left:0;top:0;bottom:0;width:0;transition:none;border-radius:11px}
.hold .hi{font-size:22px;position:relative;z-index:1;line-height:1}
.hold .hl{font-size:11px;font-weight:700;position:relative;z-index:1}
.hold .hh{font-size:8px;position:relative;z-index:1;opacity:.65}

/* Freq bar */
.fb{height:4px;background:#f3f4f6;border-radius:99px;overflow:hidden}
.ff{height:100%;border-radius:99px;transition:width .4s}

/* Row */
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:.5px solid var(--border)}
.row:last-child{border-bottom:none}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}

/* Field */
.fld{margin-bottom:10px}
.fld label{font-size:11px;font-weight:500;color:var(--text2);display:block;margin-bottom:3px}
.fld input,.fld select{width:100%;border:.5px solid rgba(0,0,0,0.12);border-radius:9px;padding:9px 11px;font-size:13px;color:var(--text);background:#fff;outline:none;font-family:inherit;transition:border-color .15s}
.fld input:focus,.fld select:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(124,58,237,.1)}

/* Ponto grid */
.pg{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:11px}
.pc{border-radius:9px;padding:7px 8px;text-align:center;border:.5px solid var(--border);background:#f9fafb;transition:all .2s}
.pc.m{background:var(--green-l);border-color:var(--green-b)}

/* Role switcher overlay */
.role-sw{position:absolute;top:12px;right:12px;z-index:100;background:rgba(255,255,255,0.95);border:.5px solid var(--border);border-radius:10px;padding:6px 8px;box-shadow:0 4px 16px rgba(0,0,0,0.15)}
.role-sw select{border:none;background:transparent;font-size:11px;font-weight:600;color:var(--purple);cursor:pointer;outline:none;font-family:inherit}

/* Toast */
.toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 16px;border-radius:10px;font-size:12px;font-weight:500;z-index:200;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,0.25)}
.toast.show{opacity:1}

/* Modal */
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,0.5);z-index:150;display:none;align-items:flex-end;justify-content:center;border-radius:40px;overflow:hidden}
.modal-bg.open{display:flex}
.mbox{background:#fff;border-radius:20px 20px 0 0;padding:20px 18px 28px;width:100%;max-height:85%;overflow-y:auto}

@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card,.hold{animation:fu .16s ease}
</style>
</head>
<body>

<div class="phone" id="phone">

  <!-- Role switcher (demo) -->
  <div class="role-sw">
    <select id="rsel" onchange="changeRole(this.value)">
      <option value="suporte">👑 Suporte</option>
      <option value="gestor">👔 Gestor</option>

        <span style="font-size:38px">📱</span><span style="font-size:10px;color:var(--text3);margin-top:4px">QR Code Pix</span><span style="font-size:10px;color:var(--text3)">R$ 280,00</span>

        <p style="font-size:15px;font-weight:700;color:var(--text)">Novo convite de acesso</p>
        <button onclick="document.getElementById('m-conv').classList.remove('open')" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text3)">✕</button>
      </div>

      <div class="fld"><label>E-mail</label><input id="c-email" type="email" placeholder="email@exemplo.com"></div>

          <option>Robótica Avançada</option><option>Violão Iniciante</option>

          <p style="font-size:10px;font-weight:600;color:var(--text2);margin-bottom:3px">🔗 Link gerado (7 dias · uso único)</p>
          <p id="c-link" style="font-size:10px;font-family:monospace;color:var(--text);word-break:break-all"></p>

  <!-- Header -->
  <div class="hdr" id="hdr"></div>

  <!-- Float card -->
  <div id="fc" style="display:none"></div>

  <!-- Scroll content -->

  <!-- Bottom nav -->

</div>

<script>
// ═══════════════════════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════════════════════
const S={
  role:'colaborador', page:'ponto',
  pontos:{entrada:null,intervalo:null,retorno:null,saida:null},
  alunos:[
    {ini:'SA',nome:'Sofia Almeida',    freq:87, s:'pend'},
    {ini:'IC',nome:'Isabella Costa',   freq:100,s:'pend'},
    {ini:'LM',nome:'Laura Mendes',     freq:68, s:'pend'},
    {ini:'VR',nome:'Valentina Rocha',  freq:93, s:'pend'},
    {ini:'BL',nome:'Beatriz Lima',     freq:75, s:'pend'},
    {ini:'CF',nome:'Clara Ferreira',   freq:100,s:'pend'},
  ],
  convites:[
    {nome:'Ana Paula Ferreira',role:'professor',  st:'usado',   dt:'22/05',t:'Ballet B'},
    {nome:'Carla Almeida',     role:'responsavel',st:'pendente',dt:'24/05',t:'—'},
    {nome:'Sofia Almeida',     role:'aluno',      st:'pendente',dt:'24/05',t:'Ballet B'},
    {nome:'Carlos Lima',       role:'professor',  st:'usado',   dt:'18/05',t:'Robótica'},
    {nome:'Sônia Ramos',       role:'professor',  st:'expirado',dt:'10/05',t:'Violão'},
  ],
};

const R={
  suporte:    {l:'Suporte',     av:'SP',cor:'#4c1d95',g:'linear-gradient(135deg,#4c1d95,#7c3aed)',n:'Suporte Admin',    s:'Acesso total'},
  gestor:     {l:'Gestor',      av:'MF',cor:'#1e1b4b',g:'linear-gradient(135deg,#1e1b4b,#312e81)',n:'Maria Fernanda',  s:'Studio Arte em Movimento'},
  professor:  {l:'Professor',   av:'AP',cor:'#085041',g:'linear-gradient(135deg,#085041,#0f6e56)',n:'Ana Paula F.',    s:'Ballet Infantil B'},
  colaborador:{l:'Colaborador', av:'AP',cor:'#4338ca',g:'linear-gradient(135deg,#4338ca,#6d28d9)',n:'Ana Paula Ferreira',s:'Instrutora · CLT'},
  responsavel:{l:'Responsável', av:'CA',cor:'#0369a1',g:'linear-gradient(135deg,#0369a1,#0c4a6e)',n:'Carla Almeida',  s:'Mãe da Sofia Almeida'},
  aluno:      {l:'Aluno',       av:'SA',cor:'#854f0b',g:'linear-gradient(135deg,#854f0b,#92400e)',n:'Sofia Almeida',  s:'Ballet Infantil B'},
};

const NAV={
  suporte:    [{i:'ti-building-community',l:'Escolas',id:'escolas'},{i:'ti-link',l:'Convites',id:'convites'},{i:'ti-settings',l:'Config',id:'config'}],
  gestor:     [{i:'ti-layout-dashboard',l:'Dashboard',id:'dashboard'},{i:'ti-users-group',l:'Turmas',id:'turmas'},{i:'ti-chart-bar',l:'Financeiro',id:'financeiro'},{i:'ti-link',l:'Acessos',id:'convites'}],
  professor:  [{i:'ti-users-group',l:'Turmas',id:'turmas'},{i:'ti-clipboard-check',l:'Chamada',id:'chamada'},{i:'ti-clock',l:'Ponto',id:'ponto'}],
  colaborador:[{i:'ti-clock',l:'Ponto',id:'ponto'},{i:'ti-calendar',l:'Histórico',id:'historico'},{i:'ti-cash',l:'Financeiro',id:'financeiro'},{i:'ti-beach',l:'Férias',id:'ferias'}],
  responsavel:[{i:'ti-calendar-check',l:'Frequência',id:'frequencia'},{i:'ti-receipt',l:'Mensalidades',id:'cobrancas'},{i:'ti-id-badge',l:'Dados',id:'dados'}],
  aluno:      [{i:'ti-users-group',l:'Minha turma',id:'turma'},{i:'ti-calendar-check',l:'Frequência',id:'frequencia'},{i:'ti-book',l:'Atividades',id:'atividades'}],
};

// ═══════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════
function fc(f){return f>=80?'#16a34a':f>=60?'#d97706':'#ef4444'}
function fb(f){return f>=80?'#f0fdf4':f>=60?'#fffbeb':'#fef2f2'}
function tn(){return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
let toastT;
function toast(msg,ms=2800){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms);
}
function cm(id,e){if(e.target.id===id)document.getElementById(id).classList.remove('open')}
function cpix(){const b=document.getElementById('pix-btn');b.textContent='✅ Copiado!';setTimeout(()=>b.textContent='📋 Copiar código Pix',2200);toast('Código Pix copiado!')}
function updConvTurma(){const v=document.getElementById('c-role').value;document.getElementById('c-tw').style.display=v==='responsavel'?'none':'block';}

// ═══════════════════════════════════════════════════════
// HOLD BUTTON
// ═══════════════════════════════════════════════════════
const holds={};
function mkHold(el,cb){
  if(!el||el._hset)return;el._hset=1;
  function start(e){
    e.preventDefault();if(el.dataset.done==='1')return;
    holds[el.id]={t:performance.now()};
    const f=el.querySelector('.hf'),lbl=el.querySelector('.hl');
    const cor=el.dataset.cor||'#7c3aed';
    el.style.boxShadow=`0 0 0 5px ${cor}22`;
    const tick=()=>{
      if(!holds[el.id])return;
      const p=Math.min((performance.now()-holds[el.id].t)/3000*100,100);
      if(f)f.style.width=p+'%';
      if(lbl)lbl.textContent=Math.round(p/100*3)+'s...';
      if(p<100){holds[el.id].r=requestAnimationFrame(tick);}
      else done();
    };
    holds[el.id].r=requestAnimationFrame(tick);
  }
  function stop(){
    if(!holds[el.id])return;
    cancelAnimationFrame(holds[el.id].r);delete holds[el.id];
    const f=el.querySelector('.hf'),lbl=el.querySelector('.hl');
    if(f)f.style.width='0%';
    if(lbl&&el.dataset.done!=='1')lbl.textContent=el.dataset.lbl||'Segurar 3s';
    el.style.boxShadow='none';
  }
  function done(){
    delete holds[el.id];el.dataset.done='1';el.style.pointerEvents='none';
    const cor=el.dataset.cor||'#7c3aed';
    el.style.background=cor;el.style.borderColor=cor;
    el.style.boxShadow=`0 4px 16px ${cor}40`;
    const ic=el.querySelector('.hi'),lbl=el.querySelector('.hl'),hh=el.querySelector('.hh'),f=el.querySelector('.hf');
    if(ic)ic.textContent='✅';
    if(lbl){lbl.textContent='Registrado!';lbl.style.color='#fff';}
    if(hh)hh.style.display='none';
    if(f){f.style.width='100%';f.style.background='rgba(255,255,255,0.18)';}
    cb();
  }
  el.addEventListener('mousedown',start);
  el.addEventListener('mouseup',stop);
  el.addEventListener('mouseleave',stop);
  el.addEventListener('touchstart',start,{passive:false});
  el.addEventListener('touchend',stop);
}

// ═══════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════
function render(){
  renderHdr();renderFC();renderNav();renderScr();
}

function renderHdr(){
  const Ri=R[S.role];
  const h=document.getElementById('hdr');
  h.style.background=Ri.g;
  const kpiMap={
    colaborador:`<div class="kpi-strip"><div class="kpi-c"><p>Banco de Horas</p><p style="color:#a3e635">+3h 20min</p></div><div class="kpi-c"><p>Férias</p><p style="color:#fde68a">15 dias</p></div><div class="kpi-c"><p>Salário Líq.</p><p style="color:#93c5fd">R$ 3.239</p></div></div>`,
    suporte:`<div class="kpi-strip"><div class="kpi-c"><p>Escolas Ativas</p><p style="color:#e9d5ff">2</p></div><div class="kpi-c"><p>Total Alunos</p><p style="color:#e9d5ff">160</p></div><div class="kpi-c"><p>Turmas</p><p style="color:#e9d5ff">14</p></div></div>`,
    gestor:`<div class="kpi-strip"><div class="kpi-c"><p>Alunos</p><p style="color:#c7d2fe">48</p></div><div class="kpi-c"><p>Faturamento</p><p style="color:#a3e635">R$ 14.280</p></div><div class="kpi-c"><p>Inadimp.</p><p style="color:#fca5a5">R$ 2.520</p></div></div>`,
    professor:`<div class="kpi-strip"><div class="kpi-c"><p>Minhas turmas</p><p style="color:#a7f3d0">2</p></div><div class="kpi-c"><p>Alunos</p><p style="color:#a7f3d0">21</p></div></div>`,
    responsavel:`<div class="kpi-strip"><div class="kpi-c"><p>Frequência</p><p style="color:#93c5fd">87%</p></div><div class="kpi-c"><p>Pendente</p><p style="color:#fde68a">R$ 280</p></div></div>`,
    aluno:`<div class="kpi-strip"><div class="kpi-c"><p>Frequência</p><p style="color:#fde68a">87%</p></div><div class="kpi-c"><p>Aulas</p><p style="color:#fde68a">16</p></div></div>`,
  };
  h.innerHTML=`

function renderFC(){

    const pts=['entrada','intervalo','retorno','saida'];
    const lb={entrada:'Entrada',intervalo:'Intervalo',retorno:'Retorno',saida:'Saída'};
    const bg={entrada:'#ecfdf5',intervalo:'#fffbeb',retorno:'#eff6ff',saida:'#fdf4ff'};
    const cl={entrada:'#065f46',intervalo:'#713f12',retorno:'#1e40af',saida:'#6b21a8'};
    const any=pts.some(t=>S.pontos[t]);
    el.innerHTML=`
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:${any?10:0}px">
        <div>

        </div>
        <div style="background:${S.pontos.entrada?'var(--green-l)':'#f9fafb'};border:.5px solid ${S.pontos.entrada?'var(--green-b)':'var(--border)'};border-radius:10px;padding:5px 11px;text-align:right">
          <p style="font-size:9px;font-weight:600;color:${S.pontos.saida?'var(--text2)':S.pontos.entrada?'var(--green)':'var(--text3)'}">${S.pontos.saida?'Encerrada':S.pontos.entrada?'🟢 Em jornada':'⚪ Sem registro'}</p>
          <p style="font-size:11px;font-weight:700;color:var(--text)">${S.pontos.saida?'Completo':S.pontos.entrada?'Em curso':'—'}</p>
        </div>
      </div>
      ${any?`<div class="pg">${pts.map(t=>`<div class="pc${S.pontos[t]?' m':''}" ${S.pontos[t]?`style="background:${bg[t]};border-color:${cl[t]}40"`:''}>
        <p style="font-size:8px;font-weight:600;color:${S.pontos[t]?cl[t]:'var(--text3)'}">${lb[t]}</p>
        <p style="font-size:13px;font-weight:700;color:${S.pontos[t]?'var(--text)':'#d1d5db'}">${S.pontos[t]||'--:--'}</p>
      </div>`).join('')}</div>`:''}`;
    clearInterval(clkI);
    const tick=()=>{const e=document.getElementById('clk');if(e)e.textContent=new Date().toLocaleTimeString('pt-BR');};
    tick();clkI=setInterval(tick,1000);
  } else {
    el.style.display='none';el.innerHTML='';
  }
}

  const view=((fn[S.role]||{})[S.page]);
  area.innerHTML=view?view():`<div class="card"><p style="color:var(--text3);text-align:center;padding:20px">Em desenvolvimento</p></div>`;
  // bind holds
  document.querySelectorAll('.hold:not([data-done="1"])').forEach(el=>{
    const tipo=el.dataset.tipo,idx=el.dataset.idx;
    if(tipo){
      mkHold(el,()=>{
        S.pontos[tipo]=tn();

  });
}

// Convite
function genConv(){
  const n=document.getElementById('c-nome').value.trim();
  const e=document.getElementById('c-email').value.trim();
  if(!n||!e.includes('@')){toast('Preencha nome e e-mail');return;}
  const t=[...Array(32)].map(()=>Math.floor(Math.random()*16).toString(16)).join('');
  const link=`https://portal.erp-educacional.com.br/entrar?token=${t}`;
  const role=document.getElementById('c-role').value;
  document.getElementById('c-link').textContent=link;
  document.getElementById('c-result').style.display='block';
  S.convites.unshift({nome:n,role,st:'pendente',dt:new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}),t:document.getElementById('c-turma')?.value||'—'});
  toast('✅ Convite gerado!');
}
function ccopy(){toast('📋 Link copiado!');}

// Role change
function changeRole(r){
  S.role=r;S.page=NAV[r][0]?.id||'dashboard';
  S.pontos={entrada:null,intervalo:null,retorno:null,saida:null};
  S.alunos.forEach(a=>a.s='pend');
  render();
}

changeRole('colaborador');
